<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson Plans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#6e1a2a; --maroon-soft:#f3e6e8; --ink:#1c1a1a; --muted:#625b5b;
  --line:#b9aeb0; --paper:#ffffff; --bg:#ece8e8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Google Sans Flex","Google Sans",system-ui,"Segoe UI",Calibri,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.3}

/* ---------- Controls (screen only) ---------- */
.controls{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid var(--maroon);padding:8px 14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px}
.controls .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.controls button,.controls select,.controls input[type=date]{font:inherit;padding:5px 10px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer}
.controls button.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.controls button:focus-visible,.controls select:focus-visible,.controls input:focus-visible{outline:3px solid #c9a227;outline-offset:1px}
.controls label{display:flex;gap:4px;align-items:center;cursor:pointer;white-space:nowrap}
.controls .sep{width:1px;height:24px;background:var(--line)}
.status{padding:8px 14px;font-size:13px;color:var(--muted)}
.sopbar{margin:0;padding:6px 14px;font-size:13px;border-bottom:1px solid var(--line);background:#fff}
.sopbar.ok{color:#1f5a2e}
.sopbar.warn{color:#8a4b00;background:#fff4e0}
@media print{.sopbar{display:none!important}}
.status.err{color:#9b1c1c;font-weight:600}

/* ---------- Page ---------- */
.sheet{background:var(--paper);margin:14px auto;padding:.4in .45in;max-width:11in;box-shadow:0 1px 6px rgba(0,0,0,.25)}
body.mode-day .sheet{max-width:8.5in}
.doc-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--maroon);padding-bottom:6px;margin-bottom:8px;gap:12px}
.doc-head .brand{display:flex;align-items:center;gap:10px}
.doc-head .logo{height:.55in;width:auto;display:block}
.doc-head h1{margin:0;font-size:20px;color:var(--maroon);letter-spacing:.2px}
.doc-head .sub{font-size:12px;color:var(--muted)}
.doc-head .who{font-size:12px;text-align:right;min-width:2in;border-bottom:1px dotted var(--line)}

/* ---------- Standards band ---------- */
.stds{border:1px solid var(--line);background:var(--maroon-soft);padding:5px 8px;margin-bottom:8px;font-size:11px;display:grid;grid-template-columns:repeat(auto-fit,minmax(2.4in,1fr));gap:2px 14px}
.stds b{color:var(--maroon)}
.stds .std{display:inline-block;margin-right:4px;font-weight:600}

/* ---------- Week grid ---------- */
table.week{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10.5px}
table.week th,table.week td{border:1px solid var(--line);padding:4px 5px;vertical-align:top}
table.week thead th{background:var(--maroon);color:#fff;font-size:12px;text-align:center;padding:4px}
table.week thead th small{display:block;font-weight:400;font-size:10px;opacity:.9}
table.week th.cls{width:1.05in;background:var(--maroon-soft);color:var(--ink);text-align:left;font-size:11px}
table.week thead th.cls{background:var(--maroon);color:#fff}
table.week th.cls .p{display:block;font-weight:400;font-size:10px;color:var(--muted)}
table.week th.cls .u{display:block;font-weight:400;font-size:9.5px;margin-top:3px;color:var(--ink)}
table.week tr{break-inside:avoid;page-break-inside:avoid}
td .tgt{font-weight:600;margin-bottom:2px}
td .blk{margin-top:3px}
td .lbl{font-weight:700;color:var(--maroon);font-size:9.5px}
td ul{margin:1px 0 0;padding-left:12px}
td li{margin:0}
td.none{color:#9a9191;font-style:italic;text-align:center}
td.spot{background:#fff8e1}
.mini-std{font-size:9px;color:var(--muted);margin-top:2px}
.links a{color:var(--maroon)}
.links span.sep{color:var(--muted)}

/* ---------- Day view ---------- */
.day-block{border:1px solid var(--line);margin-bottom:10px;break-inside:avoid;page-break-inside:avoid}
.day-block header{background:var(--maroon);color:#fff;padding:4px 8px;display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600}
.day-block header span.u{font-weight:400;font-size:12px;text-align:right}
.day-block .body{padding:6px 8px;font-size:12px}
.day-block .tgt{font-size:14px;font-weight:700;margin-bottom:4px}
.day-block .cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.day-block .blk{margin-top:4px}
.day-block .lbl{font-weight:700;color:var(--maroon);font-size:11px}
.day-block ul{margin:1px 0 0;padding-left:16px}
.day-block .spot{background:#fff8e1;border-left:4px solid #c9a227;padding:3px 6px;margin-top:5px}
.day-block .tnote{border:1px dashed var(--maroon);padding:3px 6px;margin-top:5px}
td .tn{border-top:1px dashed var(--line);padding-top:2px}
.chk{font-size:10px;margin-top:4px;color:var(--ink)}
.day-block .chk{font-size:12px;margin-top:6px}
.refl-box{border:1px solid var(--line);min-height:.55in;margin-top:6px;padding:2px 5px;font-size:10px;color:var(--muted)}
table.week tr.refl td{height:.55in}
table.week tr.refl th .p{font-weight:400}
.day-block.empty .body{color:#8a8181;font-style:italic}

/* ---------- Print ---------- */
@media print{
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .controls,.status{display:none!important}
  .sheet{margin:0;padding:0;box-shadow:none;max-width:none}
  .links a{text-decoration:none;color:var(--ink)}
  body.mode-week table.week{font-size:8.8px}
  body.mode-week table.week th,body.mode-week table.week td{padding:2.5px 4px}
  body.mode-week .doc-head h1{font-size:17px}
  body.mode-week .doc-head .logo{height:.45in}
  body.mode-week .stds{font-size:9.5px;padding:3px 6px;margin-bottom:5px}
}
</style>
<style id="pageRule">@page{size:letter landscape;margin:.4in}</style>
</head>
<body class="mode-week">

<div class="controls" id="controls">
  <div class="grp" role="group" aria-label="View">
    <button id="bWeek" class="on" type="button">Week</button>
    <button id="bDay" type="button">Day</button>
  </div>
  <div class="grp" role="group" aria-label="Date">
    <button id="bPrev" type="button" aria-label="Previous">&#9664;</button>
    <input type="date" id="dPick" aria-label="Pick a date">
    <button id="bNext" type="button" aria-label="Next">&#9654;</button>
    <button id="bToday" type="button">Today</button>
  </div>
  <span class="sep"></span>
  <div class="grp" role="group" aria-label="Classes to include" id="classBox"></div>
  <span class="sep"></span>
  <div class="grp" role="group" aria-label="Fields to show" id="fields"></div>
  <span class="sep"></span>
  <div class="grp">
    <label>Empty cells
      <select id="emptyMode"><option value="blank">blank</option><option value="noclass">"No class"</option></select>
    </label>
  </div>
  <div class="grp"><button id="bPrint" type="button">Print</button></div>
</div>
<div class="status" id="status">Loading…</div>
<div class="sopbar" id="sopbar" hidden></div>
<main class="sheet" id="sheet" hidden></main>

<script src="config.js" onerror="window.__noConfig=true"></script>
<script>
(function(){
'use strict';

/* ================= Config lookup ================= */
function readConfig(){
  var c=window.LT_CONFIG||null;
  try{ if(!c && typeof CONFIG!=='undefined') c=CONFIG; }catch(e){}
  try{ if(!c && typeof APP_CONFIG!=='undefined') c=APP_CONFIG; }catch(e){}
  try{ if(!c && typeof config!=='undefined') c=config; }catch(e){}
  try{ if(!c && typeof LT_CONFIG!=='undefined') c=LT_CONFIG; }catch(e){}
  try{ if(!c && typeof SETTINGS!=='undefined') c=SETTINGS; }catch(e){}
  if(!c){
    ['CONFIG','APP_CONFIG','config','LT_CONFIG','SETTINGS','LEARNING_TARGETS_CONFIG'].forEach(function(n){ if(!c && window[n]) c=window[n]; });
  }
  return c||{};
}
function findSheetUrl(cfg){
  if(cfg && typeof cfg.SHEET_CSV_URL==='string') return cfg.SHEET_CSV_URL.trim();
  var best='';
  (function walk(o,depth){
    if(!o||typeof o!=='object'||depth>3) return;
    Object.keys(o).forEach(function(k){
      var v=o[k];
      if(typeof v==='string' && /^https?:\/\//i.test(v) && /sheet|csv|url|source|data/i.test(k) && !best) best=v;
      else if(typeof v==='object') walk(v,depth+1);
    });
  })(cfg,0);
  return best;
}
function fixCsvUrl(u){
  if(!u) return u;
  if(/output=csv/i.test(u)) return u;
  if(/\/pub(\?|$)/.test(u)) return u+(u.indexOf('?')>-1?'&':'?')+'output=csv';
  return u;
}

/* ================= CSV / TSV parser ================= */
function parseDelimited(text){
  text=text.replace(/^\uFEFF/,'');
  var firstLine=text.split(/\r?\n/)[0]||'';
  var tabs=(firstLine.match(/\t/g)||[]).length, commas=(firstLine.match(/,/g)||[]).length;
  var d = tabs>commas ? '\t' : ',';
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=ch;
    }else{
      if(ch==='"' && cur==='') q=true;
      else if(ch===d){ row.push(cur); cur=''; }
      else if(ch==='\n'||ch==='\r'){
        if(ch==='\r'&&text[i+1]==='\n') i++;
        row.push(cur); cur=''; rows.push(row); row=[];
      } else cur+=ch;
    }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){return c.trim()!==''}); });
}
function norm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
var ALIASES={
  date:['date','day'], cls:['class','course'], period:['period','per','pd'], unit:['unit','unitname'],
  target:['learningtarget','target','ican','objective'], criteria:['successcriteria','criteria'],
  standard:['standard','standards','standardcode'], vocab:['vocabulary','vocab'],
  agenda:['agenda','activities','activity'], spotlight:['spotlight','announcement','notes','note'],
  links:['links','link'],
  materials:['lpmaterials','materials','materialsprep','prep'],
  assess:['lpassessment','assessment','evidence','assessmentevidence'],
  diff:['lpdifferentiation','differentiation','supports'],
  tnotes:['lpnotes','teachernotes','lpteachernotes']
};
function toRecords(rows){
  var head=rows[0].map(norm), idx={};
  Object.keys(ALIASES).forEach(function(k){
    for(var i=0;i<ALIASES[k].length;i++){ var p=head.indexOf(ALIASES[k][i]); if(p>-1){idx[k]=p;break;} }
  });
  var out=[];
  rows.slice(1).forEach(function(r){
    var o={}; Object.keys(ALIASES).forEach(function(k){ o[k]= idx[k]!=null ? (r[idx[k]]||'').trim() : ''; });
    o.dateObj=parseDate(o.date);
    if(o.dateObj && o.cls) out.push(o);
  });
  return out;
}
function parseDate(s){
  if(!s) return null; s=s.trim(); var m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){ var y=+m[3]; if(y<100) y+=2000; return new Date(y,+m[1]-1,+m[2]); }
  var d=new Date(s); return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
function key(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(d,n){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); }
function mondayOf(d){ var w=d.getDay(); return addDays(d, w===0?-6:1-w); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function short(d){ return MON[d.getMonth()]+' '+d.getDate(); }

/* ================= Text helpers ================= */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function splitPipes(s){ return s? s.split('|').map(function(x){return x.trim()}).filter(Boolean):[]; }
// inline [label](url) -> link, plain text escaped
function inline(s){
  var out='',last=0,re=/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,m;
  while((m=re.exec(s))){ out+=esc(s.slice(last,m.index))+'<a href="'+esc(m[2])+'" target="_blank" rel="noopener">'+esc(m[1])+'</a>'; last=re.lastIndex; }
  return out+esc(s.slice(last));
}
function hostLabel(u){
  var h=''; try{ h=new URL(u).hostname.replace(/^www\./,''); }catch(e){ return 'Link'; }
  if(/helpx\.adobe/.test(h)) return 'Adobe Help';
  if(/docs\.google/.test(h)) return /drawings/.test(u)?'Google Drawing':/presentation/.test(u)?'Google Slides':/forms/.test(u)?'Google Form':'Google Doc';
  if(/drive\.google/.test(h)) return 'Drive file';
  if(/youtube|youtu\.be/.test(h)) return 'Video';
  return h;
}
// Links column: pieces separated by | or newline. Piece may be "Label https://..." , "[Label](url)" or bare URL.
function parseLinks(s){
  var res=[]; if(!s) return res;
  s.split(/\r?\n|\|/).forEach(function(piece){
    piece=piece.trim(); if(!piece) return;
    var md=/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, m, any=false;
    while((m=md.exec(piece))){ res.push({label:m[1],url:m[2]}); any=true; }
    if(any) return;
    var u=piece.match(/https?:\/\/\S+/);
    if(u){ var label=piece.slice(0,u.index).replace(/[:\-–]\s*$/,'').trim(); res.push({label:label||hostLabel(u[0]),url:u[0]}); }
    else res.push({label:piece,url:''});
  });
  return res;
}
function linksHtml(list){
  return list.map(function(l){
    return l.url? '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>' : esc(l.label);
  }).join(' <span class="sep">&bull;</span> ');
}
function ul(items){ return items.length?'<ul>'+items.map(function(i){return '<li>'+inline(i)+'</li>'}).join('')+'</ul>':''; }

/* ================= State ================= */
var all=[], hidden={}, data=[], mode='week', anchor=new Date(), emptyMode='blank';
var FIELDS=[
  {k:'standard',label:'Standards',week:true,day:true},
  {k:'target',label:'Target',week:true,day:true},
  {k:'criteria',label:'Success criteria',week:true,day:true},
  {k:'vocab',label:'Vocabulary',week:false,day:true},
  {k:'agenda',label:'Agenda',week:true,day:true},
  {k:'spotlight',label:'Notes/Spotlight',week:false,day:true},
  {k:'links',label:'Links',week:false,day:true},
  {k:'materials',label:'Materials/Prep',week:false,day:true},
  {k:'assess',label:'Assessment',week:false,day:true},
  {k:'diff',label:'Differentiation',week:false,day:true},
  {k:'tnotes',label:'Teacher notes',week:false,day:true},
  {k:'checks',label:'Check-off boxes',week:true,day:true},
  {k:'reflect',label:'Reflection space',week:true,day:true}
];
var show={};
function applyDefaults(){ FIELDS.forEach(function(f){ show[f.k]=f[mode]; }); buildFieldBoxes(); }
function buildFieldBoxes(){
  var box=document.getElementById('fields'); box.innerHTML='';
  FIELDS.forEach(function(f){
    var l=document.createElement('label'), c=document.createElement('input');
    c.type='checkbox'; c.checked=!!show[f.k];
    c.addEventListener('change',function(){ show[f.k]=c.checked; render(); });
    l.appendChild(c); l.appendChild(document.createTextNode(f.label)); box.appendChild(l);
  });
}

/* ================= Rendering ================= */
function refilter(){ data=all.filter(function(r){return !hidden[r.cls]}); }
function subsetNote(){
  var cl=classList(all), on=cl.filter(function(c){return !hidden[c.cls]}).map(function(c){return c.cls});
  return (on.length&&on.length<cl.length)?on.join(', '):'';
}
function buildClassBoxes(){
  var box=document.getElementById('classBox'); box.innerHTML='';
  var t=document.createElement('span'); t.textContent='Classes:'; box.appendChild(t);
  classList(all).forEach(function(c){
    var l=document.createElement('label'), cb=document.createElement('input');
    cb.type='checkbox'; cb.checked=!hidden[c.cls]; cb.title=className(c.cls)||c.cls;
    cb.addEventListener('change',function(){ hidden[c.cls]=!cb.checked; refilter(); render(); });
    l.appendChild(cb); l.appendChild(document.createTextNode(c.cls)); box.appendChild(l);
  });
  var b=document.createElement('button'); b.type='button'; b.textContent='All';
  b.onclick=function(){ hidden={}; refilter(); buildClassBoxes(); render(); };
  box.appendChild(b);
}
function classList(rows){
  var m={};
  rows.forEach(function(r){
    var k=r.cls; if(!m[k]) m[k]={cls:r.cls,period:r.period,unit:r.unit};
  });
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){
    var pa=parseFloat(a.period),pb=parseFloat(b.period);
    if(isNaN(pa)) pa=99; if(isNaN(pb)) pb=99;
    return pa-pb || a.cls.localeCompare(b.cls);
  });
}
function allClasses(){ return classList(data); }
function rowsOn(d,cls){ var k=key(d); return data.filter(function(r){ return r.cls===cls && key(r.dateObj)===k; }); }

function stdsBand(rows){
  var by={}; rows.forEach(function(r){
    if(!r.standard) return;
    (by[r.cls]=by[r.cls]||{});
    r.standard.split(/[|;,]\s*(?=[A-Za-z])/).forEach(function(s){ s=s.trim(); if(s) by[r.cls][s]=1; });
  });
  var h=''; classList(rows).forEach(function(c){
    var codes=Object.keys(by[c.cls]||{}); if(!codes.length) return;
    h+='<div><b>'+esc(c.cls)+':</b> '+codes.map(function(s){return '<span class="std">'+esc(s)+'</span>'}).join('')+'</div>';
  });
  return h?'<div class="stds">'+h+'</div>':'';
}

function weekCell(rs){
  if(!rs.length) return '<td class="none">'+(emptyMode==='noclass'?'No class':'')+'</td>';
  var sp=show.spotlight && rs.some(function(r){return r.spotlight});
  var h='<td'+(sp?' class="spot"':'')+'>';
  rs.forEach(function(r,i){
    if(i) h+='<hr>';
    if(show.target && r.target) h+='<div class="tgt">'+inline(r.target)+'</div>';
    if(show.criteria && r.criteria) h+='<div class="blk"><span class="lbl">Success:</span>'+ul(splitPipes(r.criteria))+'</div>';
    if(show.agenda && r.agenda) h+='<div class="blk">'+ul(splitPipes(r.agenda))+'</div>';
    if(show.materials && r.materials) h+='<div class="blk"><span class="lbl">Prep:</span>'+ul(splitPipes(r.materials))+'</div>';
    if(show.assess && r.assess) h+='<div class="blk"><span class="lbl">Evidence:</span> '+inline(splitPipes(r.assess).join('; '))+'</div>';
    if(show.diff && r.diff) h+='<div class="blk"><span class="lbl">Support:</span> '+inline(splitPipes(r.diff).join('; '))+'</div>';
    if(show.tnotes && r.tnotes) h+='<div class="blk tn"><span class="lbl">Teacher:</span> '+inline(r.tnotes)+'</div>';
    if(show.vocab && r.vocab) h+='<div class="blk"><span class="lbl">Vocab:</span> '+esc(splitPipes(r.vocab).join(', '))+'</div>';
    if(show.spotlight && r.spotlight) h+='<div class="blk"><span class="lbl">Note:</span> '+inline(r.spotlight)+'</div>';
    if(show.links && r.links) h+='<div class="blk links">'+linksHtml(parseLinks(r.links))+'</div>';
    if(show.standard && r.standard) h+='<div class="mini-std">'+esc(r.standard)+'</div>';
  });
  if(show.checks) h+='<div class="chk">&#9744; Posted &nbsp;&#9744; Referenced</div>';
  return h+'</td>';
}

function renderWeek(){
  var mon=mondayOf(anchor), days=[0,1,2,3,4].map(function(i){return addDays(mon,i)});
  var fri=days[4], inWeek=data.filter(function(r){ return r.dateObj>=mon && r.dateObj<=fri; });
  var classes=allClasses();
  var h=head('Weekly Lesson Plans',short(mon)+' – '+short(fri)+', '+fri.getFullYear());
  if(show.standard) h+=stdsBand(inWeek);
  h+='<table class="week"><thead><tr><th class="cls">Class</th>'+days.map(function(d){
    return '<th>'+DOW[d.getDay()]+'<small>'+short(d)+'</small></th>';}).join('')+'</tr></thead><tbody>';
  classes.forEach(function(c){
    // skip classes with nothing this week
    if(!inWeek.some(function(r){return r.cls===c.cls})) return;
    var wkRow=inWeek.filter(function(r){return r.cls===c.cls})[0];
    h+='<tr><th class="cls scope-row">'+esc(c.cls)+'<span class="p">'+esc(className(c.cls))+'</span><span class="p">'+(c.period?'Period '+esc(c.period):'')+'</span>'+
       '<span class="u">'+esc(wkRow.unit||'')+'</span></th>';
    days.forEach(function(d){ h+=weekCell(rowsOn(d,c.cls)); });
    h+='</tr>';
  });
  if(show.reflect && inWeek.length){
    h+='<tr class="refl"><th class="cls">Reflection<span class="p">What worked / adjust</span></th>'+days.map(function(){return '<td></td>'}).join('')+'</tr>';
  }
  h+='</tbody></table>';
  if(!inWeek.length) h+='<p style="padding:20px;color:#625b5b">No entries for this week.</p>';
  return h;
}

function renderDay(){
  var d=new Date(anchor.getFullYear(),anchor.getMonth(),anchor.getDate());
  var k=key(d), dayRows=data.filter(function(r){return key(r.dateObj)===k});
  var h=head('Daily Lesson Plan',DOW[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear());
  var classes=classList(dayRows);
  if(!classes.length) return h+'<p style="padding:20px;color:#625b5b">No entries for this day.</p>';
  classes.forEach(function(c){
    rowsOn(d,c.cls).forEach(function(r){
      h+='<section class="day-block"><header><span>'+(r.period?'Period '+esc(r.period)+' &nbsp;':'')+esc(r.cls)+(className(r.cls)?' – '+esc(className(r.cls)):'')+'</span><span class="u">'+esc(r.unit)+'</span></header><div class="body">';
      if(show.standard && r.standard) h+='<div class="blk"><span class="lbl">Standard:</span> '+esc(r.standard)+'</div>';
      if(show.target && r.target) h+='<div class="tgt">'+inline(r.target)+'</div>';
      h+='<div class="cols">';
      if(show.criteria && r.criteria) h+='<div class="blk"><span class="lbl">Success criteria</span>'+ul(splitPipes(r.criteria))+'</div>';
      if(show.agenda && r.agenda) h+='<div class="blk"><span class="lbl">Agenda</span>'+ul(splitPipes(r.agenda))+'</div>';
      h+='</div>';
      h+='<div class="cols">';
      if(show.materials && r.materials) h+='<div class="blk"><span class="lbl">Materials / prep</span>'+ul(splitPipes(r.materials))+'</div>';
      if(show.assess && r.assess) h+='<div class="blk"><span class="lbl">Assessment / evidence</span>'+ul(splitPipes(r.assess))+'</div>';
      h+='</div>';
      if(show.diff && r.diff) h+='<div class="blk"><span class="lbl">Differentiation</span>'+ul(splitPipes(r.diff))+'</div>';
      if(show.vocab && r.vocab) h+='<div class="blk"><span class="lbl">Vocabulary:</span> '+esc(splitPipes(r.vocab).join(', '))+'</div>';
      if(show.links && r.links) h+='<div class="blk links"><span class="lbl">Links:</span> '+linksHtml(parseLinks(r.links))+'</div>';
      if(show.spotlight && r.spotlight) h+='<div class="spot">'+inline(r.spotlight)+'</div>';
      if(show.tnotes && r.tnotes) h+='<div class="tnote"><span class="lbl">Teacher notes:</span> '+inline(r.tnotes)+'</div>';
      if(show.checks) h+='<div class="chk">&#9744; Target &amp; criteria posted &nbsp;&nbsp;&#9744; Referenced during lesson</div>';
      if(show.reflect) h+='<div class="refl-box">Reflection / adjust next time:</div>';
      h+='</div></section>';
    });
  });
  return h;
}

function className(code){
  var list=(readConfig().CLASSES)||[];
  for(var i=0;i<list.length;i++) if(String(list[i].code).toLowerCase()===String(code).toLowerCase()) return list[i].name||'';
  return '';
}
var LOGO_SVG='<svg class="logo" role="img" aria-label="School logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 567.57"><polygon fill="#fff" points="590 292.25 590 0 0 0 0 292.25 162.97 292.25 162.97 331.22 111.89 331.22 111.89 567.57 478.11 567.57 478.11 331.22 427.03 331.22 427.03 292.25 590 292.25"/><polygon fill="#000" points="565 267.25 565 25 25 25 25 267.25 187.97 267.25 187.97 356.22 136.89 356.22 136.89 542.57 453.11 542.57 453.11 356.22 402.03 356.22 402.03 267.25 565 267.25"/><polygon fill="#d1d3d4" points="535.81 239.29 535.81 52.95 54.19 52.95 54.19 239.29 190.41 239.29 190.41 183.39 217.16 183.39 217.16 384.18 166.08 384.18 166.08 514.61 423.92 514.61 423.92 384.18 372.84 384.18 372.84 183.39 399.6 183.39 399.6 239.29 535.81 239.29"/><polygon fill="#822336" points="343.65 155.44 428.78 155.44 428.78 211.34 506.62 211.34 506.62 80.9 83.38 80.9 83.38 211.34 161.22 211.34 161.22 155.44 246.35 155.44 246.35 412.13 195.27 412.13 195.27 486.66 394.73 486.66 394.73 412.13 343.65 412.13 343.65 155.44"/></svg>';
function head(title,sub){
  var sn=subsetNote(); if(sn) sub+='  |  '+sn;
  var lu=readConfig().LOGO_URL;
  var logoHtml= lu ? '<img class="logo" src="'+esc(lu)+'" alt="School logo" onerror="this.style.display=\'none\'">' : LOGO_SVG;
  return '<div class="doc-head"><div class="brand">'+logoHtml+'<div><h1>'+esc(title)+'</h1><div class="sub">'+esc(sub)+'</div></div></div>'+
         '<div class="who" contenteditable="true" spellcheck="false" aria-label="Teacher and subject (editable)">Teacher / Subject</div></div>';
}

var REQ=[['standard','Standard'],['target','Learning target'],['criteria','Success criteria'],['agenda','Agenda']];
function sopCheck(rows,label){
  var bar=document.getElementById('sopbar'), miss=[];
  rows.forEach(function(r){
    var m=REQ.filter(function(q){return !r[q[0]]}).map(function(q){return q[1]});
    if(m.length) miss.push(r.cls+' '+DOW[r.dateObj.getDay()].slice(0,3)+': '+m.join(', '));
  });
  var hidden=REQ.filter(function(q){return !show[q[0]]}).map(function(q){return q[1]});
  var h='';
  if(!rows.length){ bar.hidden=true; return; }
  if(miss.length) h+='<b>Missing for SOP ('+miss.length+'):</b> '+esc(miss.join(' · '));
  else h+='SOP check: standard, target, success criteria, and agenda are filled in for every '+label+' entry.';
  if(hidden.length) h+='<br><b>Hidden from this printout:</b> '+esc(hidden.join(', '))+' (the SOP requires them in the plan).';
  bar.innerHTML=h; bar.hidden=false; bar.className='sopbar '+((miss.length||hidden.length)?'warn':'ok');
}
function render(){
  var s=document.getElementById('sheet');
  s.innerHTML = mode==='week'?renderWeek():renderDay();
  document.body.className='mode-'+mode;
  document.getElementById('pageRule').textContent='@page{size:letter '+(mode==='week'?'landscape':'portrait')+';margin:.4in}';
  document.getElementById('bWeek').classList.toggle('on',mode==='week');
  document.getElementById('bDay').classList.toggle('on',mode==='day');
  document.getElementById('dPick').value=key(anchor);
  var rowsNow, lab;
  if(mode==='week'){ var mon=mondayOf(anchor), fri=addDays(mon,4); rowsNow=data.filter(function(r){return r.dateObj>=mon&&r.dateObj<=fri}); lab='week';
    document.title='Lesson Plans '+key(mon)+' to '+key(fri)+(subsetNote()?' ('+subsetNote()+')':''); }
  else { var k=key(anchor); rowsNow=data.filter(function(r){return key(r.dateObj)===k}); lab='day';
    document.title='Lesson Plan '+k+(subsetNote()?' ('+subsetNote()+')':''); }
  sopCheck(rowsNow,lab);
}

/* ================= Wiring ================= */
function setMode(m){ mode=m; applyDefaults(); render(); }
function step(n){ anchor=addDays(anchor, mode==='week'?7*n:n); if(mode==='day'){ var w=anchor.getDay(); if(w===6) anchor=addDays(anchor,n>0?2:-1); if(w===0) anchor=addDays(anchor,n>0?1:-2);} render(); }
function $(id){return document.getElementById(id)}
$('bWeek').onclick=function(){setMode('week')};
$('bDay').onclick=function(){setMode('day')};
$('bPrev').onclick=function(){step(-1)};
$('bNext').onclick=function(){step(1)};
$('bToday').onclick=function(){ anchor=startAnchor(); render(); };
$('dPick').onchange=function(){ var d=parseDate(this.value); if(d){anchor=d;render();} };
$('emptyMode').onchange=function(){ emptyMode=this.value; render(); };
$('bPrint').onclick=function(){ window.print(); };

function startAnchor(){
  var t=new Date(); t=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  if(t.getDay()===6) t=addDays(t,2); if(t.getDay()===0) t=addDays(t,1);
  // if nothing this week, jump to the next date that has data (or the last one)
  var mon=mondayOf(t), fri=addDays(mon,4);
  var has=data.some(function(r){return r.dateObj>=mon&&r.dateObj<=fri});
  if(!has && data.length){
    var later=data.filter(function(r){return r.dateObj>fri}).sort(function(a,b){return a.dateObj-b.dateObj})[0];
    if(later) return later.dateObj;
    return data.slice().sort(function(a,b){return b.dateObj-a.dateObj})[0].dateObj;
  }
  return t;
}

function status(msg,err){ var s=$('status'); s.textContent=msg; s.className='status'+(err?' err':''); s.hidden=!msg; }

function fetchCsv(url,tries){
  return fetch(url,{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(t){
    if(/^\s*<(!doctype|html)/i.test(t)) throw new Error('Got a web page instead of CSV');
    return t;
  }).catch(function(e){
    if(tries>1) return new Promise(function(res){setTimeout(res,700)}).then(function(){return fetchCsv(url,tries-1)});
    throw e;
  });
}

function boot(){
  var cfg=readConfig(), url=findSheetUrl(cfg);
  if(!url){
    status('SHEET_CSV_URL in config.js is empty. Paste your published Google Sheet CSV link between the quotes.',true);
    return;
  }
  url=fixCsvUrl(url);
  fetchCsv(url,3).then(function(t){
    var rows=parseDelimited(t);
    if(rows.length<2) throw new Error('The CSV has no data rows');
    all=toRecords(rows); data=all;
    if(!all.length) throw new Error('No rows had a readable Date and Class');
    status('');
    $('sheet').hidden=false;
    anchor=startAnchor();
    buildClassBoxes(); applyDefaults(); render();
  }).catch(function(e){
    status('Could not load the sheet: '+e.message+'. Check the published CSV link in config.js.',true);
  });
}
window.addEventListener('load',boot);
})();
